
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, ana]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable


      - name: Android proje dosyalarini hazirla
        run: |
          flutter create --platforms=android --org com.borcasistanim --project-name borc_asistanim /tmp/borc_scaffold
          cp -a /tmp/borc_scaffold/android ./android
          rm -rf lib
          mkdir lib
          cp main.dart lib/main.dart
          test -f pubspec.yaml
          

      - name: Paketleri yukle
        run: flutter pub get

      - name: APK olustur
        run: flutter build apk --release

      - name: APK yayinla
        uses: actions/upload-artifact@v4
        with:
          name: BORC-ASISTANIM-APK
          path: build/app/outputs/flutter-apk/app-release.apk
